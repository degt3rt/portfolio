<!doctype html>
<!--
  Artfolio portfolio viewer, v1.
  Single self-contained file: no CDN, no build step, no fetch beyond the
  sibling gallery.json + theme.css. Uploaded verbatim to the artist's repo.

  Design contract (PLAN.md "Site customization"):
   - ALL colors/typography/layout knobs are CSS custom properties with
     defaults below; theme.css (generated by the app from SiteTheme tokens)
     overrides them. body[data-*] attributes switch layout variants.
   - Text from gallery.json is inserted ONLY via textContent (never
     innerHTML) — artwork titles/descriptions can never inject markup.
   - CSP: everything same-origin; inline style/script are this file's own.

  Escaping/CSP discipline inherited from pitak-x assets/publish/index.html;
  hash-routing detail view follows the common vanilla-JS lightbox pattern
  (grid -> #/work/<id> -> prev/next), state derived from location.hash so
  browser back/forward and direct links Just Work. v2 adds the #/events
  section (Works | Events & Courses nav) driven by gallery.json "events".
  v3 adds structural templates: body[data-template] switches between
  classic (default), atelier (hero + editorial grid), darkroom (sticky
  bar, hover captions), index (numbered list rows), studioCards (avatar/
  monogram header, status badges). Template CSS below; structural JS in
  the renderer keys off the same attribute.
  v4 adds the 2026-10 redesign set: salon (museum wall, framed portrait,
  hero with label), studioWall (sticky identity rail + numbered plate
  dossiers), nocturne (dark room, brass ring portrait, glowing plates),
  folio (bold catalogue: oversized masthead, duotone portrait, spec
  tables). Contact links render only when gallery.json ships them
  (publishLinks opt-in in the app).
  v5 (2026-10): featured works pin to the top of the published grid
  (the app emits works featured-first), and the visitor sort bar
  re-orders the grid by year / medium / size / price using the numeric
  areaCm2 / priceMinor keys — curated order stays the default and the
  hero never moves.

-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
<title>Portfolio</title>
<style>
  /* Token defaults — every one overridable by the generated theme.css.  */
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --text: #1c1b19;
    --text-muted: #6b675f;
    --accent: #8a5a2b;
    --font-heading: Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --scale: 1;              /* typographic scale factor */
    --heading-weight: 600;
    --grid-cols: 3;          /* max columns at desktop width */
    --gap: 14px;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: calc(16px * var(--scale));
    line-height: 1.55;
    min-height: 100vh;
  }
  a { color: var(--accent); }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: var(--heading-weight); }

  /* ---------- header ---------- */
  header { padding: calc(28px * var(--scale)) 20px 10px; text-align: center; }
  body[data-header="leftAligned"] header { text-align: left; max-width: 1100px; margin: 0 auto; }
  /* 2026-10: the bio is NEVER hidden by a design choice. The old
     data-header="minimal" rule (and darkroom's) display:none'd it —
     a palette could silently erase the artist's bio (reported live).
     The token stays valid for stored themes; it just no longer hides
     anything. */
  header h1 { margin: 0 0 4px; font-size: calc(1.9em * var(--scale)); }
  header .bio { max-width: 46em; margin: 6px auto 0; color: var(--text-muted); }
  body[data-header="leftAligned"] header .bio { margin-left: 0; }
  nav.links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  body[data-header="leftAligned"] nav.links { justify-content: flex-start; }
  nav.links a { text-decoration: none; font-size: 0.92em; }
  nav.links a:hover { text-decoration: underline; }

  /* ---------- section nav (Works | Events & Courses) ---------- */
  nav.sections { margin: 18px auto 0; display: flex; gap: 8px; justify-content: center; }
  body[data-header="leftAligned"] nav.sections { justify-content: flex-start; max-width: 1100px; margin-left: auto; margin-right: auto; }
  nav.sections a {
    text-decoration: none; color: var(--text); font-size: .95em;
    padding: 6px 16px; border-radius: 999px; border: 1px solid var(--text-muted);
  }
  nav.sections a.current { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  nav.sections .count {
    display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 5px;
    border-radius: 999px; background: var(--bg); color: var(--accent);
    font-size: .8em; text-align: center;
  }

  /* ---------- events & courses ---------- */
  .events { max-width: 720px; margin: 0 auto; }
  .events h2 { font-size: calc(1.15em * var(--scale)); margin: 26px 0 10px; }
  .event {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: var(--gap);
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .event .date {
    flex: 0 0 58px; text-align: center; border-radius: var(--radius);
    background: var(--bg); padding: 8px 4px;
  }
  .event .date .d { font-family: var(--font-heading); font-size: 1.35em;
                    font-weight: var(--heading-weight); line-height: 1.1; }
  .event .date .m { color: var(--text-muted); font-size: .78em;
                    text-transform: uppercase; letter-spacing: .06em; }
  .event .body { flex: 1; min-width: 0; }
  .event .kind {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    background: var(--accent); color: var(--bg);
    font-size: .75em; text-transform: uppercase; letter-spacing: .05em;
  }
  .event h3 { margin: 4px 0 2px; font-size: calc(1.05em * var(--scale)); }
  .event .meta { color: var(--text-muted); font-size: .88em; }
  .event .desc { margin: 6px 0 0; font-size: .94em; }
  .event .cta { display: inline-block; margin-top: 8px; font-size: .9em; }
  .event.past { opacity: .62; }
  .event.past .kind { background: var(--text-muted); }

  /* ---------- links (published bookmarks) ---------- */
  .links { max-width: 720px; margin: 0 auto; }
  .links h2 { font-size: calc(1.15em * var(--scale)); margin: 26px 0 10px; }
  .links ul { list-style: none; margin: 0; padding: 0; }
  .links li { margin-bottom: 6px; }
  .links li a {
    display: block; background: var(--surface); border-radius: var(--radius);
    padding: 12px 16px; text-decoration: none; color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .links li a:hover { text-decoration: underline; }
  .links li a::after { content: "\2197"; color: var(--text-muted); float: right; }
  .links li .host { color: var(--text-muted); font-size: .85em; margin-left: 8px; }

  /* ---------- visitor sort bar ---------- */
  .sortbar {
    display: flex; justify-content: flex-end; margin-bottom: 12px;
    color: var(--text-muted); font-size: .9em;
  }
  .sortbar label { display: inline-flex; align-items: center; gap: 8px; }
  .sortbar select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--text-muted); border-radius: var(--radius);
    padding: 4px 8px;
  }

  /* ---------- grid ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }
  .grid { display: grid; gap: var(--gap); grid-template-columns: repeat(var(--grid-cols), 1fr); }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .work {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    border: 0; padding: 0; text-align: inherit; font: inherit; color: inherit;
    display: block; width: 100%;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .work img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
  /* Placeholder for works published without a photo (no broken-image icon). */
  .work .noimg { width: 100%; aspect-ratio: 1; background: var(--bg); }
  body[data-grid="uniformPortrait"] .work img,
  body[data-grid="uniformPortrait"] .work .noimg { aspect-ratio: 3 / 4; }
  body[data-grid="masonry"] .work img { aspect-ratio: auto; }
  .stage .noimg-stage { width: 100%; height: 300px; background: var(--bg); border-radius: var(--radius); }
  .work .cap { padding: 8px 10px 10px; }
  body[data-caption="hidden"] .work .cap { display: none; }
  .work .cap .t { font-family: var(--font-heading); font-weight: var(--heading-weight); }
  body[data-titlecase="uppercase"] .work .cap .t { text-transform: uppercase; font-size: .85em; letter-spacing: .06em; }
  .work .cap .y { color: var(--text-muted); font-size: .85em; }

  /* ---------- detail ---------- */
  .detail { max-width: 900px; margin: 0 auto; }
  .detail .back { display: inline-block; margin-bottom: 12px; text-decoration: none; }
  .stage { position: relative; background: var(--surface); border-radius: var(--radius); }
  .stage img { width: 100%; max-height: 74vh; object-fit: contain; display: block; }
  .stage .navbtn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,.45); color: #fff; border: 0; border-radius: 50%;
    width: 42px; height: 42px; font-size: 20px; cursor: pointer;
  }
  .stage .prev { left: 10px; } .stage .next { right: 10px; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
  .thumbs button {
    border: 2px solid transparent; border-radius: var(--radius); padding: 0;
    background: none; cursor: pointer; flex: 0 0 auto;
  }
  .thumbs button.sel { border-color: var(--accent); }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; display: block; border-radius: calc(var(--radius) - 2px); }
  .imgcap { color: var(--text-muted); font-size: .9em; margin-top: 6px; min-height: 1.2em; }
  .specs { margin-top: 18px; }
  body[data-detail="sideBySide"] .detailwrap { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; align-items: start; }
  @media (max-width: 800px) { body[data-detail="sideBySide"] .detailwrap { display: block; } }
  .specs h2 { margin: 0 0 6px; font-size: calc(1.4em * var(--scale)); }
  .specs .desc { margin: 10px 0 16px; }
  .specs table { border-collapse: collapse; width: 100%; }
  .specs td { padding: 4px 0; vertical-align: top; }
  .specs td.k { color: var(--text-muted); width: 8.5em; padding-right: 10px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--accent); color: var(--bg); font-size: .82em;
  }
  footer { text-align: center; color: var(--text-muted); font-size: .85em; padding: 24px 0 36px; }
  .hidden { display: none !important; }
  .status { text-align: center; color: var(--text-muted); padding: 40px 0; }

  /* ================= structural templates (body[data-template]) ======
     Each block restyles the SAME markup the classic renderer produces;
     extra elements (hero, avatar, list rows) are rendered only when the
     template needs them (JS checks data-template). */

  /* ---------- atelier: editorial, hero artwork, catalogue captions --- */
  body[data-template="atelier"] header h1 { font-size: calc(2.6em * var(--scale)); }
  body[data-template="atelier"] .bio { font-style: italic; }
  body[data-template="atelier"] .work { box-shadow: none; background: none; }
  body[data-template="atelier"] .work .cap { padding: 10px 2px 0; }
  body[data-template="atelier"] .work .cap .t { font-style: italic; }
  body[data-template="atelier"] .work img { aspect-ratio: 4 / 3; }
  .hero { margin: 8px 0 26px; cursor: pointer; grid-column: 1 / -1; }
  .hero img { width: 100%; max-height: 60vh; object-fit: cover; display: block; border-radius: var(--radius); }
  .hero .herocap { margin-top: 10px; color: var(--text-muted); font-size: .92em; }
  .hero .herocap .t { color: var(--text); font-style: italic; }

  /* ---------- darkroom: sticky bar, masonry, hover captions --------- */
  body[data-template="darkroom"] header {
    position: sticky; top: 0; z-index: 2; text-align: left;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--surface);
    padding: 14px 20px; display: flex; align-items: baseline;
    gap: 22px; flex-wrap: wrap;
  }
  body[data-template="darkroom"] header h1 {
    font-size: calc(1.05em * var(--scale)); letter-spacing: .22em;
    text-transform: uppercase;
  }
  /* darkroom keeps its compact bar, but the bio stays visible (see the
     note at data-header="minimal" — no design may hide the bio). */
  body[data-template="darkroom"] header .bio { font-size: .85em; margin: 0; }
  body[data-template="darkroom"] nav.links { margin: 0 0 0 auto; }
  body[data-template="darkroom"] nav.sections { margin: 0; border: 0; padding: 0; }
  body[data-template="darkroom"] nav.sections a { border: 0; padding: 0 4px; text-transform: uppercase; font-size: .82em; color: var(--text-muted); background: none; }
  body[data-template="darkroom"] nav.sections a.current { color: var(--text); background: none; }
  body[data-template="darkroom"] .grid { display: block; columns: var(--grid-cols); column-gap: var(--gap); }
  body[data-template="darkroom"] .work { position: relative; margin: 0 0 var(--gap); break-inside: avoid; box-shadow: none; }
  body[data-template="darkroom"] .work img { aspect-ratio: auto; }
  body[data-template="darkroom"] .work .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.78));
    opacity: 0; transition: opacity .18s; color: #fff;
  }
  body[data-template="darkroom"] .work:hover .cap,
  body[data-template="darkroom"] .work:focus-visible .cap { opacity: 1; }
  body[data-template="darkroom"] .work .cap .y { color: #b9b9c2; }
  @media (max-width: 900px) { body[data-template="darkroom"] .grid { columns: 2; } }
  @media (max-width: 520px) { body[data-template="darkroom"] .grid { columns: 1; } }

  /* ---------- index: numbered list rows ------------------------------ */
  body[data-template="index"] header { border-bottom: 3px solid var(--text); padding-bottom: 14px; }
  body[data-template="index"] header h1 {
    font-size: calc(2.8em * var(--scale)); text-transform: uppercase;
    letter-spacing: -0.02em;
  }
  body[data-template="index"] nav.sections a { border-radius: 0; border-color: var(--text); }
  body[data-template="index"] nav.sections a.current { background: var(--text); border-color: var(--text); color: var(--bg); }
  body[data-template="index"] .grid { display: block; }
  body[data-template="index"] .work.row {
    display: grid; grid-template-columns: 3.2em 1fr 200px; gap: 18px;
    align-items: center; padding: 16px 0; margin: 0;
    border-bottom: 1px solid var(--text-muted); border-radius: 0;
    background: none; box-shadow: none; overflow: visible;
  }
  body[data-template="index"] .work.row:hover { background: var(--surface); }
  @media (max-width: 620px) { body[data-template="index"] .work.row { grid-template-columns: 2.4em 1fr 96px; } }
  body[data-template="index"] .work.row .no { color: var(--text-muted); }
  body[data-template="index"] .work.row .cap { padding: 0; }
  body[data-template="index"] .work.row .cap .t { text-transform: uppercase; }
  body[data-template="index"] .work.row img { aspect-ratio: 16 / 10; border-radius: 0; }
  body[data-template="index"] .work.row .noimg { aspect-ratio: 16 / 10; }

  /* ---------- avatar (photo: every template; monogram: studioCards) ----
     The photo shows in EVERY template when the artist opted in
     (gallery.json artist.avatar) — only size/placement differ. The
     .hidden class on the markup is the visibility gate (JS removes it);
     no display rules here, so the gate cannot desync from the CSS. */
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; margin: 0 auto 12px;
  }
  body[data-header="leftAligned"] header .avatar { margin-left: 0; }
  body[data-template="darkroom"] .avatar {
    width: 34px; height: 34px; margin: 0; align-self: center;
  }
  .avatar.mono {
    align-items: center; justify-content: center;
    background: var(--accent); color: var(--bg);
    font-family: var(--font-heading); font-size: 2em;
    font-weight: var(--heading-weight);
  }

  /* ---------- studioCards: rounded cards, avatar, badges ------------- */
  body[data-template="studioCards"] header {
    display: flex; gap: 22px; align-items: center; text-align: left;
    max-width: 1100px; margin: 0 auto; flex-wrap: wrap;
  }
  body[data-template="studioCards"] header .headbody { flex: 1; min-width: 240px; }
  body[data-template="studioCards"] header .bio { margin-left: 0; }
  body[data-template="studioCards"] .avatar {
    width: 88px; height: 88px; margin: 0; flex: 0 0 auto;
  }
  body[data-template="studioCards"] .avatar.mono { display: flex; }
  body[data-template="studioCards"] nav.links a {
    background: var(--surface); padding: 5px 14px; border-radius: 999px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  body[data-template="studioCards"] .work {
    border-radius: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.10);
    transition: transform .15s;
  }
  body[data-template="studioCards"] .work:hover { transform: translateY(-3px); }
  body[data-template="studioCards"] .work .cap { padding: 12px 16px 15px; }
  .work .cap .gbadge {
    display: none; background: var(--accent); color: var(--bg);
    font-size: .72em; border-radius: 999px; padding: 2px 10px;
    margin-top: 7px;
  }
  body[data-template="studioCards"] .work .cap .gbadge { display: inline-block; }

  /* ============ v4 templates (2026-10 redesign mockups) ============
     Hairline color derived from existing tokens (color-mix), so every
     palette gets a matching rule color with no compiler change. */
  body[data-template="salon"],
  body[data-template="studioWall"],
  body[data-template="nocturne"],
  body[data-template="folio"] {
    --line: color-mix(in srgb, var(--text-muted) 32%, transparent);
  }

  /* ---------- per-artwork info panel (2026-10) ----------------------
     Every card in the v4 templates carries ALL user-supplied info in a
     distinct panel INSIDE the artwork's frame: description plus a
     spec table (Year, Medium, Dimensions, Technique, Series, Price).
     Status stays a visual chip (pill/stamp) per template. */
  .infopanel { text-align: left; }
  .infopanel .desc { font-size: .9em; margin: 8px 0 4px; }
  .infopanel table {
    border-collapse: collapse; width: 100%; font-size: .82em;
    margin-top: 8px;
  }
  .infopanel td {
    padding: 6px 0; border-top: 1px solid var(--line);
    vertical-align: top;
  }
  .infopanel td.k {
    color: var(--text-muted); width: 7em; padding-right: 10px;
    text-transform: uppercase; letter-spacing: .08em; font-size: .9em;
  }

  /* Featured mark — visible on EVERY v2 template (2026-10): toggling
     "Feature this work" must show an immediate effect on the site, not
     only on hero-bearing templates. */
  .infopanel .pill + .pill { margin-left: 6px; }
  .stamp.feat { background: var(--accent); }
  .stamp + .stamp { margin-left: 6px; }
  body[data-template="nocturne"] .meta .specs .feat { color: var(--accent); }

  /* ---------- salon: museum-wall editorial -------------------------
     Grid masthead (text left, framed portrait right), a "wall" hero
     with museum label, transparent cards with catalogue captions. */
  body[data-template="salon"] header {
    display: grid; grid-template-columns: 1fr 200px; gap: 40px;
    align-items: end; text-align: left; max-width: 1100px;
    margin: 0 auto; padding-bottom: 40px;
    border-bottom: 1px solid var(--line);
  }
  body[data-template="salon"] header .headbody { grid-column: 1; grid-row: 1; }
  body[data-template="salon"] header .avatar {
    grid-column: 2; grid-row: 1; width: 100%; height: auto;
    aspect-ratio: 3/4; border-radius: 0; border: 1px solid var(--line);
    background: var(--surface); padding: 8px; margin: 0;
  }
  body[data-template="salon"] header h1 {
    font-size: calc(2.8em * var(--scale)); font-weight: 400;
  }
  body[data-template="salon"] header .bio {
    font-family: var(--font-heading); font-style: italic;
    font-size: calc(1.15em * var(--scale)); margin-top: 16px;
  }
  body[data-template="salon"] nav.links {
    justify-content: flex-start; gap: 20px; margin-top: 18px;
  }
  body[data-template="salon"] nav.links a {
    text-transform: uppercase; letter-spacing: .1em; font-size: .78em;
    border-bottom: 1px solid var(--accent); padding-bottom: 2px;
  }
  body[data-template="salon"] nav.sections {
    grid-column: 1 / -1; justify-content: flex-start; margin-top: 24px;
  }
  body[data-template="salon"] .hero img {
    border: 1px solid var(--line); background: var(--surface);
    padding: 22px; max-height: 68vh; object-fit: contain;
  }
  body[data-template="salon"] .hero .infopanel {
    max-width: 460px; margin: 14px auto 0;
  }
  body[data-template="salon"] .work { background: none; box-shadow: none; }
  /* The card IS one frame: image above, info panel below, one border.
     Every listing image sits in the SAME 4:3 matte (2026-10 user
     decision): contain, never crop — smaller works leave more matte,
     exactly like a real gallery frame. */
  body[data-template="salon"] .work .frame {
    border: 1px solid var(--line); background: var(--surface);
    padding: 14px;
  }
  body[data-template="salon"] .work .frame > img {
    aspect-ratio: 4/3; object-fit: contain; display: block; width: 100%;
  }
  body[data-template="salon"] .work .infopanel {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  body[data-template="salon"] .work .infopanel .t {
    font-family: var(--font-heading); font-style: italic;
    font-size: 1.12em; font-weight: 400;
  }
  body[data-template="salon"] .work .infopanel .pill { margin-top: 10px; }
  .herostatus {
    display: inline-block; margin-top: 8px; padding: 2px 12px;
    border: 1px solid var(--accent); color: var(--accent);
    font-size: .72em; letter-spacing: .12em; text-transform: uppercase;
  }
  body[data-template="salon"] footer {
    text-transform: uppercase; letter-spacing: .14em; font-size: .74em;
    border-top: 1px solid var(--line); max-width: 1100px;
    margin: 0 auto; padding-top: 26px;
  }
  @media (max-width: 720px) {

<!-- theme.css comes LAST so its :root tokens override the inline defaults
     above (equal specificity -> document order decides). Until 2026-10 the
     link sat BEFORE the style block and every published site silently
     rendered the built-in defaults regardless of the chosen theme. -->
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<header>
  <!-- Avatar photo renders in EVERY template when the artist opted in
       (gallery.json artist.avatar); the monogram circle is the
       studioCards-only fallback when no photo was published. -->
  <img class="avatar hidden" id="avatar" alt="" />
  <div class="avatar mono hidden" id="avatar-mono" aria-hidden="true"></div>
  <div class="headbody">
  <h1 id="artist-name"></h1>
  <p class="bio" id="artist-bio"></p>
  <nav class="links" id="artist-links"></nav>
  </div>
  <!-- Section nav renders only when gallery.json has a non-empty events
       array; a works-only site looks exactly like before. -->
  <nav class="sections hidden" id="sections">
    <a href="#/" id="tab-works">Works</a>
    <a href="#/events" id="tab-events" class="hidden">Events &amp; Courses</a>
    <a href="#/links" id="tab-links" class="hidden">Links</a>
  </nav>
</header>
<main>
  <div class="status" id="status">Loading…</div>
  <!-- Visitor sort bar: built by JS only when there are 2+ works and at
       least one carries a sortable field (year/medium/areaCm2/priceMinor). -->
  <div class="sortbar hidden" id="sortbar"></div>
  <div class="grid hidden" id="grid"></div>
  <div class="detail hidden" id="detail"></div>
  <div class="events hidden" id="events"></div>
  <div class="links hidden" id="links"></div>
</main>
<footer id="footer"></footer>
<script>
"use strict";
/* All user text goes through textContent — never string-built HTML. */
(function () {
  var DATA = null;
  var statusEl = document.getElementById("status");
  var gridEl = document.getElementById("grid");
  var detailEl = document.getElementById("detail");
  var eventsEl = document.getElementById("events");
  var linksEl = document.getElementById("links");
  var sectionsEl = document.getElementById("sections");
  var sortbarEl = document.getElementById("sortbar");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  /* ---------- header ---------- */
  function template() {
    return document.body.getAttribute("data-template") || "classic";
  }

  function renderHeader(artist) {
    document.getElementById("artist-name").textContent = artist.name || "";
    document.getElementById("artist-bio").textContent = artist.bio || "";
    if (artist.name) document.title = artist.name;
    /* avatar file name is a fixed constant published by the app; only
       its PRESENCE comes from gallery.json, never a free-form path.
       Opted-in photo shows in every template; the monogram fallback is
       studioCards-only (other templates simply omit a missing photo). */
    if (artist.avatar === true) {
      var av = document.getElementById("avatar");
      av.src = "images/avatar.jpg";
      av.classList.remove("hidden");
    } else if (template() === "studioCards") {
      var initials = (artist.name || "").split(/\s+/)
        .map(function (p) { return p.charAt(0); })
        .slice(0, 2).join("").toUpperCase();
      var mono = document.getElementById("avatar-mono");
      mono.textContent = initials || "\u25cf";
      mono.classList.remove("hidden");
    }
    var nav = document.getElementById("artist-links");
    (artist.links || []).forEach(function (l) {
      if (typeof l.url !== "string" || !/^https:\/\//.test(l.url)) return;
      var a = el("a", null, l.label || l.url);
      a.href = l.url;              /* https-only enforced above */
      a.rel = "noopener noreferrer";
      a.target = "_blank";
      nav.appendChild(a);
    });
    document.getElementById("footer").textContent =
      (artist.name ? artist.name + " · " : "") + "Made with Artfolio";
  }

  /* ---------- grid ---------- */
  /* Statuses that get the quiet (outline) treatment, not the loud one. */
  function isQuietStatus(status) {
    return /nfs|not for sale|sold/i.test(status || "");
  }

  /* The full per-artwork info panel (2026-10): the public description
     plus a spec table of EVERY user-supplied field. Status stays out of
     the table — it renders as a visual chip (pill/stamp) per template.
     Returns null when the work carries no info at all. */
  function infoTable(w) {
    var table = document.createElement("table");
    function row(k, v) {
      if (v === undefined || v === null || v === "") return;
      var tr = document.createElement("tr");
      tr.appendChild(el("td", "k", k));
      tr.appendChild(el("td", null, v));
      table.appendChild(tr);
    }
    row("Year", w.year);
    row("Medium", w.medium);
    row("Dimensions", w.dimensions);
    row("Technique", w.technique);
    row("Series", w.series);
    row("Price", w.price);
    return table.children.length ? table : null;
  }

  function infoPanel(w) {
    var panel = el("div", "infopanel");
    if (w.description) panel.appendChild(el("p", "desc", w.description));
    var table = infoTable(w);
    if (table) panel.appendChild(table);
    return panel.children.length ? panel : null;
  }

  /* Builds one card; `num` (1-based) is used by the numbered templates. */
  function workCard(w, num) {
    var t = template();
    var isIndex = t === "index";
    var isFolio = t === "folio";
    var isPlate = t === "studioWall" || t === "nocturne";
    var card = el("button",
      isIndex || isFolio ? "work row" : isPlate ? "work plate" : "work");
    card.type = "button";
    card.setAttribute("aria-label", w.title || "Artwork");

    function thumb() {
      var primary = (w.images || [])[0];
      if (!primary) return el("div", "noimg");
      var img = document.createElement("img");
      img.loading = "lazy";
      img.alt = w.title || "";
      img.src = "images/" + encodeURIComponent(primary.id) + "_t.jpg";
      return img;
    }

    /* Plates show the DISPLAY rendition (they are the big presentation). */
    function plateImg() {
      var primary = (w.images || [])[0];
      if (!primary) return el("div", "noimg");
      var img = document.createElement("img");
      img.loading = "lazy";
      img.alt = w.title || "";
      img.src = "images/" + encodeURIComponent(primary.id) + "_d.jpg";
      return img;
    }

    /* salon: one frame — image above, full info panel below. */
    if (t === "salon") {
      var sFrame = el("div", "frame");
      sFrame.appendChild(thumb());
      var sPanel = el("div", "infopanel");
      sPanel.appendChild(el("div", "t", w.title || ""));
      if (w.description) sPanel.appendChild(el("p", "desc", w.description));
      var sTable = infoTable(w);
      if (sTable) sPanel.appendChild(sTable);
      if (w.featured === true) {
        sPanel.appendChild(el("span", "pill feat", "\u2726 Featured"));
      }
      if (w.status) {
        sPanel.appendChild(el("span",
          "pill" + (isQuietStatus(w.status) ? " muted" : ""), w.status));
      }
      sFrame.appendChild(sPanel);
      card.appendChild(sFrame);
      card.addEventListener("click", function () {
        location.hash = "#/work/" + encodeURIComponent(w.id);
      });
      return card;
    }

    /* studioWall: framed art with the numbered dossier INSIDE the same
       frame (no · title + full info panel · status pill). */
    if (t === "studioWall") {
      var art = el("div", "art");
      art.appendChild(plateImg());
      var dossier = el("div", "dossier");
      dossier.appendChild(el("div", "no", (num < 10 ? "0" : "") + num));
      var mid = el("div");
      mid.appendChild(el("div", "t", w.title || ""));
      if (w.featured === true) {
        mid.appendChild(el("span", "pill feat", "\u2726 Featured"));
      }
      var dPanel = infoPanel(w);
      if (dPanel) mid.appendChild(dPanel);
      dossier.appendChild(mid);
      if (w.status) {
        dossier.appendChild(el("span",
          "pill" + (isQuietStatus(w.status) ? " muted" : ""), w.status));
      }
      art.appendChild(dossier);
      card.appendChild(art);
      card.addEventListener("click", function () {
        location.hash = "#/work/" + encodeURIComponent(w.id);
      });
      return card;
    }

    /* nocturne: dark frame holding image + title row + full info panel. */
    if (t === "nocturne") {
      var frame = el("div", "frame");
      frame.appendChild(plateImg());
      var nmeta = el("div", "meta");
      nmeta.appendChild(el("div", "t", w.title || ""));
      var nspecs = el("div", "specs");
      if (w.featured === true) {
        nspecs.appendChild(el("span", "feat", "\u2726 Featured"));
        if (w.status) nspecs.appendChild(document.createTextNode(" \u00b7 "));
      }
      if (w.status) nspecs.appendChild(el("span", "status", w.status));
      nmeta.appendChild(nspecs);
      frame.appendChild(nmeta);
      var nPanel = infoPanel(w);
      if (nPanel) frame.appendChild(nPanel);
      card.appendChild(frame);
      card.addEventListener("click", function () {
        location.hash = "#/work/" + encodeURIComponent(w.id);
      });
      return card;
    }

    /* folio: index number · art · full spec panel + stamp. */
    if (isFolio) {
      card.appendChild(el("div", "idx", (num < 10 ? "0" : "") + num));
      var fArt = el("div", "art");
      fArt.appendChild(plateImg());
      card.appendChild(fArt);
      var spec = el("div", "spec infopanel");
      spec.appendChild(el("div", "t", w.title || ""));
      if (w.description) spec.appendChild(el("p", "desc", w.description));
      var fTable = infoTable(w);
      if (fTable) spec.appendChild(fTable);
      if (w.featured === true) {
        spec.appendChild(el("span", "stamp feat", "\u2726 Featured"));
      }
      if (w.status) {
        spec.appendChild(el("span",
          "stamp" + (isQuietStatus(w.status) ? " muted" : ""), w.status));
      }
      card.appendChild(spec);
      card.addEventListener("click", function () {
        location.hash = "#/work/" + encodeURIComponent(w.id);
      });
      return card;
    }

    var cap = el("div", "cap");
    cap.appendChild(el("div", "t", w.title || ""));
    var meta = [];
    if (w.medium) meta.push(w.medium);
    if (w.year) meta.push(w.year);
    if (isIndex || t === "atelier") {
      /* catalogue caption: medium · year */
      if (meta.length) cap.appendChild(el("div", "y", meta.join(" \u00b7 ")));
    } else if (w.year) {
      cap.appendChild(el("div", "y", w.year));
    }
    if (t === "studioCards") {
      var badge = [];
      if (w.status) badge.push(w.status);
      if (w.price) badge.push(w.price);
      if (badge.length) {
        cap.appendChild(el("span", "gbadge", badge.join(" \u00b7 ")));
      }
    }

    if (isIndex) {
      card.appendChild(el("div", "no",
        (num < 10 ? "0" : "") + num));
      card.appendChild(cap);
      card.appendChild(thumb());
    } else {
      card.appendChild(thumb());
      card.appendChild(cap);
    }
    card.addEventListener("click", function () {
      location.hash = "#/work/" + encodeURIComponent(w.id);
    });
    return card;
  }

  /* ---------- visitor sort (2026-10) ---------- */
  /* The app publishes works in CURATED order (featured first, then the
     artist's manual order). The sort bar lets VISITORS re-order the grid
     by year / medium / size / price without touching that curation —
     "Curated order" restores it. Rules, kept deliberately simple:
       - works missing the chosen field sink to the END;
       - ties keep the curated relative order (Array.sort is stable);
       - the atelier/salon hero is NOT affected: the featured work stays
         the artist's spotlight under every visitor sort (renderGrid
         picks it from the curated WORKS, never the sorted view).
     Sort keys ship in gallery.json: year/medium as displayed, plus the
     app's numeric areaCm2 (cm²) / priceMinor (minor units) — both
     already public information, just machine-comparable. */
  var WORKS = [];
  var currentSort = "curated";
  var SORT_AVAILABLE = false;

  var SORTS = [
    ["curated", "Curated order"],
    ["year-desc", "Newest first"],
    ["year-asc", "Oldest first"],
    ["medium", "Medium A\u2013Z"],
    ["size-desc", "Largest first"],
    ["price-desc", "Price: high to low"],
    ["price-asc", "Price: low to high"]
  ];

  /* Numbers only from validated JSON — a hand-edited gallery.json with
     a string in a numeric slot sorts as "missing", never NaN-chaos. */
  function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }

  function sortValue(w) {
    switch (currentSort) {
      case "year-desc": case "year-asc": return num(w.year);
      case "size-desc": return num(w.areaCm2);
      case "price-desc": case "price-asc": return num(w.priceMinor);
      case "medium":
        return w.medium ? String(w.medium).toLowerCase() : null;
      default: return null;
    }
  }

  function sortedWorks() {
    if (currentSort === "curated") return WORKS;
    var ascending = currentSort === "year-asc" ||
      currentSort === "price-asc" || currentSort === "medium";
    var out = WORKS.slice();
    out.sort(function (a, b) {
      var av = sortValue(a), bv = sortValue(b);
      if (av === null && bv === null) return 0;
      if (av === null) return 1;  /* missing sinks to the end */
      if (bv === null) return -1;
      if (av === bv) return 0;    /* stable: curated order breaks ties */
      if (currentSort === "medium") {
        return String(av).localeCompare(String(bv));
      }
      return (av < bv ? -1 : 1) * (ascending ? 1 : -1);
    });
    return out;
  }

  /* Builds the bar only when sorting could ever change something:
     2+ works AND at least one sortable field present. Fixed strings
     only — no gallery.json text touches these nodes. */
  function buildSortBar() {
    if (WORKS.length < 2) return;
    var sortable = WORKS.some(function (w) {
      return num(w.year) !== null || !!w.medium ||
        num(w.areaCm2) !== null || num(w.priceMinor) !== null;
    });
    if (!sortable) return;
    var label = el("label", null, "Sort: ");
    var select = document.createElement("select");
    select.id = "sort-select";
    SORTS.forEach(function (pair) {
      var opt = document.createElement("option");
      opt.value = pair[0];
      opt.textContent = pair[1];
      select.appendChild(opt);
    });
    select.addEventListener("change", function () {
      currentSort = select.value;
      renderGrid(sortedWorks());
    });
    label.appendChild(select);
    sortbarEl.appendChild(label);
    SORT_AVAILABLE = true;
  }

  function renderGrid(works) {
    gridEl.textContent = "";
    /* atelier & salon: hero = first featured work IN CURATED ORDER
       (fallback: first work with an image) — a visitor's sort never
       moves the artist's spotlight. The hero STANDS IN FOR that work —
       it is not repeated as a grid card underneath (the duplication
       read as a bug). salon adds a museum-label status chip under the
       hero caption. */
    var heroId = null;
    var wantsHero = template() === "atelier" || template() === "salon";
    if (wantsHero && works.length) {
      var hero = WORKS.find(function (w) { return w.featured === true; })
        || WORKS[0];
      var hImg = (hero.images || [])[0];
      if (hImg) {
        heroId = hero.id;
        var fig = el("figure", "hero");
        var img = document.createElement("img");
        img.alt = hero.title || "";
        img.src = "images/" + encodeURIComponent(hImg.id) + "_d.jpg";
        fig.appendChild(img);
        var hc = el("figcaption", "herocap");
        hc.appendChild(el("span", "t", hero.title || ""));
        var hMeta = [];
        if (hero.medium) hMeta.push(hero.medium);
        if (hero.dimensions) hMeta.push(hero.dimensions);
        if (hero.year) hMeta.push(hero.year);
        if (hMeta.length) {
          hc.appendChild(document.createTextNode(
            " \u2014 " + hMeta.join(", ")));
        }
        if (template() === "salon" && hero.status) {
          hc.appendChild(document.createElement("br"));
          hc.appendChild(el("span", "herostatus", hero.status));
        }
        fig.appendChild(hc);
        /* salon: the hero work is excluded from the grid, so it must
           carry the full info panel here — every work shows every
           user-supplied field (2026-10). */
        if (template() === "salon") {
          var hPanel = infoPanel(hero);
          if (hPanel) fig.appendChild(hPanel);
        }
        fig.addEventListener("click", function () {
          location.hash = "#/work/" + encodeURIComponent(hero.id);
        });
        gridEl.appendChild(fig);
      }
    }
    works.forEach(function (w, i) {
      if (heroId !== null && w.id === heroId) return; /* shown as hero */
      gridEl.appendChild(workCard(w, i + 1));
    });
  }

  /* ---------- detail ---------- */
  var current = { work: null, index: 0 };

  function renderDetail(work) {
    detailEl.textContent = "";
    current.work = work;
    if (current.index >= (work.images || []).length) current.index = 0;

    var back = el("a", "back", "\u2190 All works");
    back.href = "#/";
    detailEl.appendChild(back);

    var wrap = el("div", "detailwrap");
    var left = el("div");
    var stage = el("div", "stage");
    if ((work.images || []).length) {
      var img = document.createElement("img");
      img.id = "stage-img";
      img.alt = work.title || "";
      stage.appendChild(img);
    } else {
      stage.appendChild(el("div", "noimg-stage"));
    }
    if ((work.images || []).length > 1) {
      var prev = el("button", "navbtn prev", "\u2039");
      prev.type = "button"; prev.setAttribute("aria-label", "Previous image");
      prev.addEventListener("click", function () { step(-1); });
      var next = el("button", "navbtn next", "\u203a");
      next.type = "button"; next.setAttribute("aria-label", "Next image");
      next.addEventListener("click", function () { step(1); });
      stage.appendChild(prev); stage.appendChild(next);
    }
    left.appendChild(stage);

    var thumbs = el("div", "thumbs");
    thumbs.id = "thumbs";
    (work.images || []).forEach(function (im, i) {
      var b = el("button");
      b.type = "button";
      b.setAttribute("aria-label", "Image " + (i + 1));
      var t = document.createElement("img");
      t.src = "images/" + encodeURIComponent(im.id) + "_t.jpg";
      t.alt = "";
      b.appendChild(t);
      b.addEventListener("click", function () { show(i); });
      thumbs.appendChild(b);
    });
    if ((work.images || []).length > 1) left.appendChild(thumbs);
    left.appendChild(el("div", "imgcap")).id = "imgcap";

    var specs = el("div", "specs");
    specs.appendChild(el("h2", null, work.title || ""));
    if (work.description) specs.appendChild(el("p", "desc", work.description));
    var table = document.createElement("table");
    function row(k, v) {
      if (v === undefined || v === null || v === "") return;
      var tr = document.createElement("tr");
      tr.appendChild(el("td", "k", k));
      tr.appendChild(el("td", null, v));
      table.appendChild(tr);
    }
    row("Year", work.year);
    row("Medium", work.medium);
    row("Dimensions", work.dimensions);
    row("Technique", work.technique);
    row("Series", work.series);
    row("Price", work.price);
    specs.appendChild(table);
    if (work.status) {
      var b = el("span", "badge", work.status);
      specs.appendChild(el("p")).appendChild(b);
    }
    wrap.appendChild(left);
    wrap.appendChild(specs);
    detailEl.appendChild(wrap);
    show(current.index);
  }

  function show(i) {
    var work = current.work;
    if (!work || !(work.images || []).length) return;
    var n = work.images.length;
    current.index = ((i % n) + n) % n;
    var im = work.images[current.index];
    document.getElementById("stage-img").src =
      "images/" + encodeURIComponent(im.id) + "_d.jpg";
    document.getElementById("imgcap").textContent = im.caption || "";
    var thumbs = document.getElementById("thumbs");
    if (thumbs) {
      Array.prototype.forEach.call(thumbs.children, function (b, j) {
        b.className = j === current.index ? "sel" : "";
      });
    }
  }

  function step(d) { show(current.index + d); }

  /* keyboard + touch swipe */
  document.addEventListener("keydown", function (e) {
    if (detailEl.classList.contains("hidden")) return;
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Escape") location.hash = "#/";
  });
  var touchX = null;
  document.addEventListener("touchstart", function (e) {
    touchX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null || detailEl.classList.contains("hidden")) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  /* ---------- events & courses ---------- */
  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN",
                "JUL","AUG","SEP","OCT","NOV","DEC"];

  function parseDay(iso) {
    var p = String(iso).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]); /* local, date-only */
  }
  function fmtDay(iso) {
    var d = parseDay(iso);
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  /* Same rule as the app's isPastEvent: over when end (or start) < today. */
  function isPast(ev) {
    var end = parseDay(ev.end || ev.start);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return end < today;
  }

  function eventCard(ev, past) {
    var card = el("article", "event" + (past ? " past" : ""));
    var start = parseDay(ev.start);
    var date = el("div", "date");
    date.appendChild(el("div", "d", start.getDate()));
    date.appendChild(el("div", "m", MONTHS[start.getMonth()]));
    card.appendChild(date);

    var body = el("div", "body");
    body.appendChild(el("span", "kind", ev.kind || "event"));
    body.appendChild(el("h3", null, ev.title || ""));
    var meta = ev.end ? fmtDay(ev.start) + " \u2013 " + fmtDay(ev.end)
                      : fmtDay(ev.start);
    if (ev.time) meta += " \u00b7 " + ev.time;
    if (ev.location) meta += " \u00b7 " + ev.location;
    if (ev.price) meta += " \u00b7 " + ev.price;
    body.appendChild(el("div", "meta", meta));
    if (ev.description) body.appendChild(el("p", "desc", ev.description));
    /* https-only, same gate as artist links; no CTA on past events. */
    if (ev.url && !past && /^https:\/\//.test(ev.url)) {
      var cta = el("a", "cta", "Details / registration \u2192");
      cta.href = ev.url;
      cta.rel = "noopener noreferrer";
      cta.target = "_blank";
      body.appendChild(cta);
    }
    card.appendChild(body);
    return card;
  }

  /* Renders the events view once; returns the UPCOMING count (badge). */
  function renderEvents(events) {
    eventsEl.textContent = "";
    var upcoming = [], past = [];
    events.forEach(function (ev) {
      (isPast(ev) ? past : upcoming).push(ev);
    });
    upcoming.sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    past.sort(function (a, b) { return a.start > b.start ? -1 : 1; });
    if (upcoming.length) {
      eventsEl.appendChild(el("h2", null, "Upcoming"));
      upcoming.forEach(function (ev) {
        eventsEl.appendChild(eventCard(ev, false));
      });
    }
    if (past.length) {
      eventsEl.appendChild(el("h2", null, "Past"));
      past.forEach(function (ev) {
        eventsEl.appendChild(eventCard(ev, true));
      });
    }
    return upcoming.length;
  }

  /* ---------- links (published bookmarks) ---------- */
  function renderLinks(links) {
    linksEl.textContent = "";
    /* Group by label, preserving array order (app sorts label, name). */
    var groups = [];
    /* Null prototype: a label named "__proto__" or "constructor" must be
       a plain key, not a collision with Object.prototype (a hand-edited
       gallery.json could otherwise kill the whole render). */
    var byLabel = Object.create(null);
    links.forEach(function (l) {
      var key = l.label || "";
      if (!(key in byLabel)) {
        byLabel[key] = [];
        groups.push(key);
      }
      byLabel[key].push(l);
    });
    groups.forEach(function (key) {
      if (key) linksEl.appendChild(el("h2", null, key));
      var ul = el("ul");
      byLabel[key].forEach(function (l) {
        /* https-only, same gate as artist links / event CTAs. */
        if (typeof l.url !== "string" || !/^https:\/\//.test(l.url)) return;
        var a = el("a", null, l.name || l.url);
        a.href = l.url;
        a.rel = "noopener noreferrer";
        a.target = "_blank";
        var host = /^https:\/\/([^\/]+)/.exec(l.url);
        if (host) a.appendChild(el("span", "host", host[1]));
        var li = el("li");
        li.appendChild(a);
        ul.appendChild(li);
      });
      linksEl.appendChild(ul);
    });
  }

  /* ---------- hash router ---------- */
  function route() {
    if (!DATA) return;
    var hasEvents = (DATA.events || []).length > 0;
    var hasLinks = (DATA.links || []).length > 0;
    var onEvents = location.hash === "#/events" && hasEvents;
    var onLinks = location.hash === "#/links" && hasLinks;
    var onSection = onEvents || onLinks;
    var m = /^#\/work\/([^\/]+)$/.exec(location.hash);
    if (m && !onSection) {
      var id = decodeURIComponent(m[1]);
      var work = DATA.works.find(function (w) { return w.id === id; });
      if (work) {
        current.index = 0;
        renderDetail(work);
        gridEl.classList.add("hidden");
        sortbarEl.classList.add("hidden");
        eventsEl.classList.add("hidden");
        linksEl.classList.add("hidden");
        detailEl.classList.remove("hidden");
        window.scrollTo(0, 0);
        return;
      }
    }
    detailEl.classList.add("hidden");
    gridEl.classList.toggle("hidden", onSection);
    /* The sort bar follows the works grid: hidden on Events/Links, and
       never shown at all when nothing on the site is sortable. */
    sortbarEl.classList.toggle("hidden", onSection || !SORT_AVAILABLE);
    eventsEl.classList.toggle("hidden", !onEvents);
    linksEl.classList.toggle("hidden", !onLinks);
    document.getElementById("tab-works").classList
      .toggle("current", !onSection);
    document.getElementById("tab-events").classList
      .toggle("current", onEvents);
    document.getElementById("tab-links").classList
      .toggle("current", onLinks);
  }
  window.addEventListener("hashchange", route);

  /* ---------- boot ---------- */
  fetch("gallery.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      DATA = data;
      /* Apply layout tokens FIRST — renderHeader/renderGrid read
         data-template. Values are constrained to [a-zA-Z]+; anything
         else is ignored (colors/fonts arrive via theme.css). */
      var layout = data.layout || {};
      ["grid", "caption", "detail", "header", "titlecase", "template"]
        .forEach(function (k) {
          var v = layout[k];
          if (typeof v === "string" && /^[a-zA-Z]+$/.test(v)) {
            document.body.setAttribute("data-" + k, v);
          }
        });
      renderHeader(data.artist || {});
      WORKS = data.works || [];
      buildSortBar();
      renderGrid(sortedWorks());
      /* Sections: render once; each tab appears only when its array is
         non-empty, and the nav itself shows when ANY section exists. */
      var events = data.events || [];
      var links = data.links || [];
      var upcomingCount = renderEvents(events);
      renderLinks(links);
      if (events.length) {
        document.getElementById("tab-events").classList.remove("hidden");
        if (upcomingCount) {
          document.getElementById("tab-events")
            .appendChild(el("span", "count", upcomingCount));
        }
      }
      if (links.length) {
        document.getElementById("tab-links").classList.remove("hidden");
      }
      if (events.length || links.length) {
        sectionsEl.classList.remove("hidden");
      }
      statusEl.classList.add("hidden");
      route();
    })
    .catch(function () {
      statusEl.textContent = "This portfolio could not be loaded.";
    });
})();
</script>
</body>
</html>
