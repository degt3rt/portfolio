<!doctype html>
<!--
  Artfolio portfolio viewer, v1.
  Single self-contained file: no CDN, no build step, no fetch beyond the
  sibling gallery.json + theme.css. Uploaded verbatim to the artist's repo.

  Design contract (PLAN.md "Site customization"):
   - ALL colors/typography/layout knobs are CSS custom properties with
     defaults below; theme.css (generated by the app from SiteTheme tokens)
     overrides them. body[data-*] attributes switch layout variants.
   - Text from gallery.json is inserted ONLY via textContent (never
     innerHTML) — artwork titles/descriptions can never inject markup.
   - CSP: everything same-origin; inline style/script are this file's own.

  Escaping/CSP discipline inherited from pitak-x assets/publish/index.html;
  hash-routing detail view follows the common vanilla-JS lightbox pattern
  (grid -> #/work/<id> -> prev/next), state derived from location.hash so
  browser back/forward and direct links Just Work. v2 adds the #/events
  section (Works | Events & Courses nav) driven by gallery.json "events".
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
<title>Portfolio</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* Token defaults — every one overridable by the generated theme.css.  */
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --text: #1c1b19;
    --text-muted: #6b675f;
    --accent: #8a5a2b;
    --font-heading: Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --scale: 1;              /* typographic scale factor */
    --heading-weight: 600;
    --grid-cols: 3;          /* max columns at desktop width */
    --gap: 14px;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: calc(16px * var(--scale));
    line-height: 1.55;
    min-height: 100vh;
  }
  a { color: var(--accent); }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: var(--heading-weight); }

  /* ---------- header ---------- */
  header { padding: calc(28px * var(--scale)) 20px 10px; text-align: center; }
  body[data-header="leftAligned"] header { text-align: left; max-width: 1100px; margin: 0 auto; }
  body[data-header="minimal"] header .bio { display: none; }
  header h1 { margin: 0 0 4px; font-size: calc(1.9em * var(--scale)); }
  header .bio { max-width: 46em; margin: 6px auto 0; color: var(--text-muted); }
  body[data-header="leftAligned"] header .bio { margin-left: 0; }
  nav.links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  body[data-header="leftAligned"] nav.links { justify-content: flex-start; }
  nav.links a { text-decoration: none; font-size: 0.92em; }
  nav.links a:hover { text-decoration: underline; }

  /* ---------- section nav (Works | Events & Courses) ---------- */
  nav.sections { margin: 18px auto 0; display: flex; gap: 8px; justify-content: center; }
  body[data-header="leftAligned"] nav.sections { justify-content: flex-start; max-width: 1100px; margin-left: auto; margin-right: auto; }
  nav.sections a {
    text-decoration: none; color: var(--text); font-size: .95em;
    padding: 6px 16px; border-radius: 999px; border: 1px solid var(--text-muted);
  }
  nav.sections a.current { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  nav.sections .count {
    display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 5px;
    border-radius: 999px; background: var(--bg); color: var(--accent);
    font-size: .8em; text-align: center;
  }

  /* ---------- events & courses ---------- */
  .events { max-width: 720px; margin: 0 auto; }
  .events h2 { font-size: calc(1.15em * var(--scale)); margin: 26px 0 10px; }
  .event {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: var(--gap);
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .event .date {
    flex: 0 0 58px; text-align: center; border-radius: var(--radius);
    background: var(--bg); padding: 8px 4px;
  }
  .event .date .d { font-family: var(--font-heading); font-size: 1.35em;
                    font-weight: var(--heading-weight); line-height: 1.1; }
  .event .date .m { color: var(--text-muted); font-size: .78em;
                    text-transform: uppercase; letter-spacing: .06em; }
  .event .body { flex: 1; min-width: 0; }
  .event .kind {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    background: var(--accent); color: var(--bg);
    font-size: .75em; text-transform: uppercase; letter-spacing: .05em;
  }
  .event h3 { margin: 4px 0 2px; font-size: calc(1.05em * var(--scale)); }
  .event .meta { color: var(--text-muted); font-size: .88em; }
  .event .desc { margin: 6px 0 0; font-size: .94em; }
  .event .cta { display: inline-block; margin-top: 8px; font-size: .9em; }
  .event.past { opacity: .62; }
  .event.past .kind { background: var(--text-muted); }

  /* ---------- links (published bookmarks) ---------- */
  .links { max-width: 720px; margin: 0 auto; }
  .links h2 { font-size: calc(1.15em * var(--scale)); margin: 26px 0 10px; }
  .links ul { list-style: none; margin: 0; padding: 0; }
  .links li { margin-bottom: 6px; }
  .links li a {
    display: block; background: var(--surface); border-radius: var(--radius);
    padding: 12px 16px; text-decoration: none; color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .links li a:hover { text-decoration: underline; }
  .links li a::after { content: "\2197"; color: var(--text-muted); float: right; }
  .links li .host { color: var(--text-muted); font-size: .85em; margin-left: 8px; }

  /* ---------- grid ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }
  .grid { display: grid; gap: var(--gap); grid-template-columns: repeat(var(--grid-cols), 1fr); }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .work {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    border: 0; padding: 0; text-align: inherit; font: inherit; color: inherit;
    display: block; width: 100%;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .work img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
  /* Placeholder for works published without a photo (no broken-image icon). */
  .work .noimg { width: 100%; aspect-ratio: 1; background: var(--bg); }
  body[data-grid="uniformPortrait"] .work img,
  body[data-grid="uniformPortrait"] .work .noimg { aspect-ratio: 3 / 4; }
  body[data-grid="masonry"] .work img { aspect-ratio: auto; }
  .stage .noimg-stage { width: 100%; height: 300px; background: var(--bg); border-radius: var(--radius); }
  .work .cap { padding: 8px 10px 10px; }
  body[data-caption="hidden"] .work .cap { display: none; }
  .work .cap .t { font-family: var(--font-heading); font-weight: var(--heading-weight); }
  body[data-titlecase="uppercase"] .work .cap .t { text-transform: uppercase; font-size: .85em; letter-spacing: .06em; }
  .work .cap .y { color: var(--text-muted); font-size: .85em; }

  /* ---------- detail ---------- */
  .detail { max-width: 900px; margin: 0 auto; }
  .detail .back { display: inline-block; margin-bottom: 12px; text-decoration: none; }
  .stage { position: relative; background: var(--surface); border-radius: var(--radius); }
  .stage img { width: 100%; max-height: 74vh; object-fit: contain; display: block; }
  .stage .navbtn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,.45); color: #fff; border: 0; border-radius: 50%;
    width: 42px; height: 42px; font-size: 20px; cursor: pointer;
  }
  .stage .prev { left: 10px; } .stage .next { right: 10px; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
  .thumbs button {
    border: 2px solid transparent; border-radius: var(--radius); padding: 0;
    background: none; cursor: pointer; flex: 0 0 auto;
  }
  .thumbs button.sel { border-color: var(--accent); }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; display: block; border-radius: calc(var(--radius) - 2px); }
  .imgcap { color: var(--text-muted); font-size: .9em; margin-top: 6px; min-height: 1.2em; }
  .specs { margin-top: 18px; }
  body[data-detail="sideBySide"] .detailwrap { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; align-items: start; }
  @media (max-width: 800px) { body[data-detail="sideBySide"] .detailwrap { display: block; } }
  .specs h2 { margin: 0 0 6px; font-size: calc(1.4em * var(--scale)); }
  .specs .desc { margin: 10px 0 16px; }
  .specs table { border-collapse: collapse; width: 100%; }
  .specs td { padding: 4px 0; vertical-align: top; }
  .specs td.k { color: var(--text-muted); width: 8.5em; padding-right: 10px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--accent); color: var(--bg); font-size: .82em;
  }
  footer { text-align: center; color: var(--text-muted); font-size: .85em; padding: 24px 0 36px; }
  .hidden { display: none !important; }
  .status { text-align: center; color: var(--text-muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1 id="artist-name"></h1>
  <p class="bio" id="artist-bio"></p>
  <nav class="links" id="artist-links"></nav>
  <!-- Section nav renders only when gallery.json has a non-empty events
       array; a works-only site looks exactly like before. -->
  <nav class="sections hidden" id="sections">
    <a href="#/" id="tab-works">Works</a>
    <a href="#/events" id="tab-events" class="hidden">Events &amp; Courses</a>
    <a href="#/links" id="tab-links" class="hidden">Links</a>
  </nav>
</header>
<main>
  <div class="status" id="status">Loading…</div>
  <div class="grid hidden" id="grid"></div>
  <div class="detail hidden" id="detail"></div>
  <div class="events hidden" id="events"></div>
  <div class="links hidden" id="links"></div>
</main>
<footer id="footer"></footer>
<script>
"use strict";
/* All user text goes through textContent — never string-built HTML. */
(function () {
  var DATA = null;
  var statusEl = document.getElementById("status");
  var gridEl = document.getElementById("grid");
  var detailEl = document.getElementById("detail");
  var eventsEl = document.getElementById("events");
  var linksEl = document.getElementById("links");
  var sectionsEl = document.getElementById("sections");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  /* ---------- header ---------- */
  function renderHeader(artist) {
    document.getElementById("artist-name").textContent = artist.name || "";
    document.getElementById("artist-bio").textContent = artist.bio || "";
    if (artist.name) document.title = artist.name;
    var nav = document.getElementById("artist-links");
    (artist.links || []).forEach(function (l) {
      if (typeof l.url !== "string" || !/^https:\/\//.test(l.url)) return;
      var a = el("a", null, l.label || l.url);
      a.href = l.url;              /* https-only enforced above */
      a.rel = "noopener noreferrer";
      a.target = "_blank";
      nav.appendChild(a);
    });
    document.getElementById("footer").textContent =
      (artist.name ? artist.name + " · " : "") + "Made with Artfolio";
  }

  /* ---------- grid ---------- */
  function renderGrid(works) {
    gridEl.textContent = "";
    works.forEach(function (w) {
      var card = el("button", "work");
      card.type = "button";
      card.setAttribute("aria-label", w.title || "Artwork");
      var primary = (w.images || [])[0];
      if (primary) {
        var img = document.createElement("img");
        img.loading = "lazy";
        img.alt = w.title || "";
        img.src = "images/" + encodeURIComponent(primary.id) + "_t.jpg";
        card.appendChild(img);
      } else {
        card.appendChild(el("div", "noimg"));
      }
      var cap = el("div", "cap");
      cap.appendChild(el("div", "t", w.title || ""));
      if (w.year) cap.appendChild(el("div", "y", w.year));
      card.appendChild(cap);
      card.addEventListener("click", function () {
        location.hash = "#/work/" + encodeURIComponent(w.id);
      });
      gridEl.appendChild(card);
    });
  }

  /* ---------- detail ---------- */
  var current = { work: null, index: 0 };

  function renderDetail(work) {
    detailEl.textContent = "";
    current.work = work;
    if (current.index >= (work.images || []).length) current.index = 0;

    var back = el("a", "back", "\u2190 All works");
    back.href = "#/";
    detailEl.appendChild(back);

    var wrap = el("div", "detailwrap");
    var left = el("div");
    var stage = el("div", "stage");
    if ((work.images || []).length) {
      var img = document.createElement("img");
      img.id = "stage-img";
      img.alt = work.title || "";
      stage.appendChild(img);
    } else {
      stage.appendChild(el("div", "noimg-stage"));
    }
    if ((work.images || []).length > 1) {
      var prev = el("button", "navbtn prev", "\u2039");
      prev.type = "button"; prev.setAttribute("aria-label", "Previous image");
      prev.addEventListener("click", function () { step(-1); });
      var next = el("button", "navbtn next", "\u203a");
      next.type = "button"; next.setAttribute("aria-label", "Next image");
      next.addEventListener("click", function () { step(1); });
      stage.appendChild(prev); stage.appendChild(next);
    }
    left.appendChild(stage);

    var thumbs = el("div", "thumbs");
    thumbs.id = "thumbs";
    (work.images || []).forEach(function (im, i) {
      var b = el("button");
      b.type = "button";
      b.setAttribute("aria-label", "Image " + (i + 1));
      var t = document.createElement("img");
      t.src = "images/" + encodeURIComponent(im.id) + "_t.jpg";
      t.alt = "";
      b.appendChild(t);
      b.addEventListener("click", function () { show(i); });
      thumbs.appendChild(b);
    });
    if ((work.images || []).length > 1) left.appendChild(thumbs);
    left.appendChild(el("div", "imgcap")).id = "imgcap";

    var specs = el("div", "specs");
    specs.appendChild(el("h2", null, work.title || ""));
    if (work.description) specs.appendChild(el("p", "desc", work.description));
    var table = document.createElement("table");
    function row(k, v) {
      if (v === undefined || v === null || v === "") return;
      var tr = document.createElement("tr");
      tr.appendChild(el("td", "k", k));
      tr.appendChild(el("td", null, v));
      table.appendChild(tr);
    }
    row("Year", work.year);
    row("Medium", work.medium);
    row("Dimensions", work.dimensions);
    row("Technique", work.technique);
    row("Series", work.series);
    row("Price", work.price);
    specs.appendChild(table);
    if (work.status) {
      var b = el("span", "badge", work.status);
      specs.appendChild(el("p")).appendChild(b);
    }
    wrap.appendChild(left);
    wrap.appendChild(specs);
    detailEl.appendChild(wrap);
    show(current.index);
  }

  function show(i) {
    var work = current.work;
    if (!work || !(work.images || []).length) return;
    var n = work.images.length;
    current.index = ((i % n) + n) % n;
    var im = work.images[current.index];
    document.getElementById("stage-img").src =
      "images/" + encodeURIComponent(im.id) + "_d.jpg";
    document.getElementById("imgcap").textContent = im.caption || "";
    var thumbs = document.getElementById("thumbs");
    if (thumbs) {
      Array.prototype.forEach.call(thumbs.children, function (b, j) {
        b.className = j === current.index ? "sel" : "";
      });
    }
  }

  function step(d) { show(current.index + d); }

  /* keyboard + touch swipe */
  document.addEventListener("keydown", function (e) {
    if (detailEl.classList.contains("hidden")) return;
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Escape") location.hash = "#/";
  });
  var touchX = null;
  document.addEventListener("touchstart", function (e) {
    touchX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null || detailEl.classList.contains("hidden")) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  /* ---------- events & courses ---------- */
  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN",
                "JUL","AUG","SEP","OCT","NOV","DEC"];

  function parseDay(iso) {
    var p = String(iso).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]); /* local, date-only */
  }
  function fmtDay(iso) {
    var d = parseDay(iso);
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  /* Same rule as the app's isPastEvent: over when end (or start) < today. */
  function isPast(ev) {
    var end = parseDay(ev.end || ev.start);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return end < today;
  }

  function eventCard(ev, past) {
    var card = el("article", "event" + (past ? " past" : ""));
    var start = parseDay(ev.start);
    var date = el("div", "date");
    date.appendChild(el("div", "d", start.getDate()));
    date.appendChild(el("div", "m", MONTHS[start.getMonth()]));
    card.appendChild(date);

    var body = el("div", "body");
    body.appendChild(el("span", "kind", ev.kind || "event"));
    body.appendChild(el("h3", null, ev.title || ""));
    var meta = ev.end ? fmtDay(ev.start) + " \u2013 " + fmtDay(ev.end)
                      : fmtDay(ev.start);
    if (ev.time) meta += " \u00b7 " + ev.time;
    if (ev.location) meta += " \u00b7 " + ev.location;
    if (ev.price) meta += " \u00b7 " + ev.price;
    body.appendChild(el("div", "meta", meta));
    if (ev.description) body.appendChild(el("p", "desc", ev.description));
    /* https-only, same gate as artist links; no CTA on past events. */
    if (ev.url && !past && /^https:\/\//.test(ev.url)) {
      var cta = el("a", "cta", "Details / registration \u2192");
      cta.href = ev.url;
      cta.rel = "noopener noreferrer";
      cta.target = "_blank";
      body.appendChild(cta);
    }
    card.appendChild(body);
    return card;
  }

  /* Renders the events view once; returns the UPCOMING count (badge). */
  function renderEvents(events) {
    eventsEl.textContent = "";
    var upcoming = [], past = [];
    events.forEach(function (ev) {
      (isPast(ev) ? past : upcoming).push(ev);
    });
    upcoming.sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    past.sort(function (a, b) { return a.start > b.start ? -1 : 1; });
    if (upcoming.length) {
      eventsEl.appendChild(el("h2", null, "Upcoming"));
      upcoming.forEach(function (ev) {
        eventsEl.appendChild(eventCard(ev, false));
      });
    }
    if (past.length) {
      eventsEl.appendChild(el("h2", null, "Past"));
      past.forEach(function (ev) {
        eventsEl.appendChild(eventCard(ev, true));
      });
    }
    return upcoming.length;
  }

  /* ---------- links (published bookmarks) ---------- */
  function renderLinks(links) {
    linksEl.textContent = "";
    /* Group by label, preserving array order (app sorts label, name). */
    var groups = [];
    var byLabel = {};
    links.forEach(function (l) {
      var key = l.label || "";
      if (!(key in byLabel)) {
        byLabel[key] = [];
        groups.push(key);
      }
      byLabel[key].push(l);
    });
    groups.forEach(function (key) {
      if (key) linksEl.appendChild(el("h2", null, key));
      var ul = el("ul");
      byLabel[key].forEach(function (l) {
        /* https-only, same gate as artist links / event CTAs. */
        if (typeof l.url !== "string" || !/^https:\/\//.test(l.url)) return;
        var a = el("a", null, l.name || l.url);
        a.href = l.url;
        a.rel = "noopener noreferrer";
        a.target = "_blank";
        var host = /^https:\/\/([^\/]+)/.exec(l.url);
        if (host) a.appendChild(el("span", "host", host[1]));
        var li = el("li");
        li.appendChild(a);
        ul.appendChild(li);
      });
      linksEl.appendChild(ul);
    });
  }

  /* ---------- hash router ---------- */
  function route() {
    if (!DATA) return;
    var hasEvents = (DATA.events || []).length > 0;
    var hasLinks = (DATA.links || []).length > 0;
    var onEvents = location.hash === "#/events" && hasEvents;
    var onLinks = location.hash === "#/links" && hasLinks;
    var onSection = onEvents || onLinks;
    var m = /^#\/work\/([^\/]+)$/.exec(location.hash);
    if (m && !onSection) {
      var id = decodeURIComponent(m[1]);
      var work = DATA.works.find(function (w) { return w.id === id; });
      if (work) {
        current.index = 0;
        renderDetail(work);
        gridEl.classList.add("hidden");
        eventsEl.classList.add("hidden");
        linksEl.classList.add("hidden");
        detailEl.classList.remove("hidden");
        window.scrollTo(0, 0);
        return;
      }
    }
    detailEl.classList.add("hidden");
    gridEl.classList.toggle("hidden", onSection);
    eventsEl.classList.toggle("hidden", !onEvents);
    linksEl.classList.toggle("hidden", !onLinks);
    document.getElementById("tab-works").classList
      .toggle("current", !onSection);
    document.getElementById("tab-events").classList
      .toggle("current", onEvents);
    document.getElementById("tab-links").classList
      .toggle("current", onLinks);
  }
  window.addEventListener("hashchange", route);

  /* ---------- boot ---------- */
  fetch("gallery.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      DATA = data;
      renderHeader(data.artist || {});
      /* Apply layout tokens the theme compiler put in gallery.json (the
         data- switches; colors/fonts arrive via theme.css). Values are
         constrained to [a-zA-Z]+ — anything else is ignored. */
      var layout = data.layout || {};
      ["grid", "caption", "detail", "header", "titlecase"].forEach(function (k) {
        var v = layout[k];
        if (typeof v === "string" && /^[a-zA-Z]+$/.test(v)) {
          document.body.setAttribute("data-" + k, v);
        }
      });
      renderGrid(data.works || []);
      /* Sections: render once; each tab appears only when its array is
         non-empty, and the nav itself shows when ANY section exists. */
      var events = data.events || [];
      var links = data.links || [];
      var upcomingCount = renderEvents(events);
      renderLinks(links);
      if (events.length) {
        document.getElementById("tab-events").classList.remove("hidden");
        if (upcomingCount) {
          document.getElementById("tab-events")
            .appendChild(el("span", "count", upcomingCount));
        }
      }
      if (links.length) {
        document.getElementById("tab-links").classList.remove("hidden");
      }
      if (events.length || links.length) {
        sectionsEl.classList.remove("hidden");
      }
      statusEl.classList.add("hidden");
      route();
    })
    .catch(function () {
      statusEl.textContent = "This portfolio could not be loaded.";
    });
})();
</script>
</body>
</html>
